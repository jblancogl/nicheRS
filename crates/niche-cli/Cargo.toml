[package]
name = "niche-cli"
description = "NicheRS command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "niche"
path = "src/main.rs"

[dependencies]
niche-maxent = { path = "../niche-maxent" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
directories = "6.0.0"
rayon = "1.12.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
niche-app = { version = "0.1.0", path = "../niche-app" }
niche-server = { version = "0.1.0", path = "../niche-server" }
niche-data = { version = "0.1.0", path = "../niche-data" }
niche-geo = { version = "0.1.0", path = "../niche-geo" }
jiff = "0.2.38"

[lints]
workspace = true

[lib]
name = "niche_cli"
path = "src/lib.rs"

[package]
name = "niche-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = "0.8.9"
futures-util = "0.3.34"
mime_guess = "2.0.5"
niche-app = { version = "0.1.0", path = "../niche-app" }
niche-geo = { version = "0.1.0", path = "../niche-geo" }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "fs"] }
tower-http = { version = "0.7.1", features = ["trace", "set-header"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
